name: Example Campaign

tasks:
  - id: task_1
    capability: SAFE_SHELL
    prompt: echo "Hello from Task 1"

  - id: task_2
    capability: SAFE_SHELL
    prompt: echo "Hello from Task 2" && sleep 1
    depends_on:
      - task_1

  - id: task_3
    capability: SAFE_SHELL
    prompt: echo "Hello from Task 3"
    depends_on:
      - task_2
