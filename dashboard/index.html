<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ROME — Mesh Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #05070a;
        --grid-line: rgba(255, 255, 255, 0.03);
        --panel: rgba(13, 17, 23, 0.8);
        --border: rgba(255, 255, 255, 0.08);
        --accent: #38bdf8;
        --text: #f1f5f9;
        --text-dim: #64748b;
        --success: #10b981;
        --failed: #f43f5e;
        --pending: #f59e0b;
        --running: #3b82f6;
        --registered: #475569;
        --radius: 8px;
      }

      * { box-sizing: border-box; }
      html, body { 
        margin: 0; padding: 0; height: 100%; 
        background: var(--bg);
        /* Subtle Imperial Alignment Grid */
        background-image: 
          linear-gradient(var(--grid-line) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
        background-size: 40px 40px;
        color: var(--text); 
        font-family: 'IBM Plex Sans', sans-serif;
        overflow: hidden;
      }

      .app {
        display: grid;
        grid-template-rows: auto auto 1fr;
        height: 100vh;
        padding: 32px;
        gap: 24px;
      }

      /* Alignment & Header */
      .header {
        position: relative; overflow: hidden;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
        margin: -32px -32px 0 -32px;
        min-height: 80px;
        padding: 0 32px;
        background: rgba(13, 17, 23, 0.4);
      }
      .brand { position: relative; z-index: 1; }
      .brand h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: 0.1em; color: #fff; }
      .brand p { margin: 4px 0 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; color: var(--text-dim); font-weight: 600; }

      .sys-info { display: flex; align-items: center; gap: 8px; }
      .chip {
        background: rgba(0,0,0,0.5);
        border: 1px solid var(--border);
        padding: 6px 14px;
        border-radius: 30px;
        font-size: 10px;
        font-weight: 700;
        font-family: 'IBM Plex Mono', monospace;
        color: var(--text-dim);
      }
      .chip span { color: #fff; }

      /* Stat Chips */
      .stats-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .stat-chip {
        background: rgba(0,0,0,0.5);
        border: 1px solid var(--border);
        padding: 6px 14px;
        border-radius: 30px;
        font-size: 10px;
        font-weight: 700;
        font-family: 'IBM Plex Mono', monospace;
        color: var(--text-dim);
        display: flex;
        align-items: center;
        gap: 6px;
        backdrop-filter: blur(10px);
      }
      .stat-chip label { text-transform: uppercase; color: var(--text-dim); margin: 0; }
      .stat-chip .val { color: #fff; }
      .stat-chip .sub-val { font-size: 9px; opacity: 0.5; color: var(--text-dim); }

      /* Main Pipeline Grid */
      .main {
        display: flex;
        gap: 20px;
        min-height: 0;
      }

      .main-content {
        flex: 3;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .sidebar {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 20px;
        min-height: 0;
      }

      .box {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        backdrop-filter: blur(10px);
        transition: flex 0.3s cubic-bezier(0.4, 0, 0.2, 1), height 0.3s ease;
        flex: 1;
      }

      .box.collapsed {
        flex: 0 0 30px !important;
      }
      .box.collapsed .scroll, .box.collapsed #caps {
        display: none;
      }

      .box-header {
        padding: 0 24px;
        height: 30px;
        background: rgba(255,255,255,0.02);
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        user-select: none;
      }
      .box-header:hover { background: rgba(255,255,255,0.05); }
      .box-header h2 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.2em; color: var(--text-dim); }

      .scroll { flex: 1; overflow-y: auto; padding: 24px; }
      .scroll::-webkit-scrollbar { width: 4px; }
      .scroll::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

      /* Causal Task Cards */
      .task-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
        gap: 16px;
      }
      .card {
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
        position: relative;
        display: flex;
        flex-direction: column;
        transition: border-color 0.2s;
        cursor: pointer;
      }
      .card:hover { border-color: var(--accent); }
      .card::before {
        content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
        background: var(--status-color, var(--registered));
      }

      .card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
      .task-id { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; color: var(--text-dim); }
      .cap-badge { font-size: 10px; font-weight: 800; background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 4px; color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.2); }

      .goal { font-size: 14px; font-weight: 700; color: #fff; line-height: 1.4; margin-bottom: 4px; }
      .intent { font-size: 12px; color: var(--text-dim); margin-bottom: 12px; font-style: italic; }
      .cause { font-size: 11px; color: var(--failed); background: rgba(244, 63, 94, 0.1); padding: 6px 10px; border-radius: 4px; margin-top: auto; border: 1px solid rgba(244, 63, 94, 0.2); }

      .prog-bar { height: 3px; background: rgba(255,255,255,0.05); border-radius: 2px; margin: 12px 0; overflow: hidden; }
      .prog-fill { height: 100%; background: var(--status-color, var(--running)); transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

      .card-foot { display: flex; justify-content: space-between; font-size: 10px; font-weight: 700; font-family: 'IBM Plex Mono', monospace; color: var(--text-dim); text-transform: uppercase; }

      /* Signal Stream */
      .log-line { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.02); font-family: 'IBM Plex Mono', monospace; font-size: 11px; }
      .log-line .ts { color: var(--registered); flex-shrink: 0; }
      .log-line .tag { color: var(--accent); flex-shrink: 0; font-weight: 700; width: 60px; }
      .log-line .msg { color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      /* Overlay */
      .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 1000; }
      .overlay.active { display: flex; }
      .modal { width: 90%; max-width: 900px; max-height: 80vh; background: #0c0f16; border: 1px solid var(--border-hover); border-radius: 12px; display: flex; flex-direction: column; box-shadow: 0 40px 100px rgba(0,0,0,0.8); }
      .modal-body { padding: 32px; overflow-y: auto; flex: 1; }
      .modal-body pre { margin: 0; white-space: pre-wrap; font-size: 13px; line-height: 1.6; color: #cbd5e1; font-family: 'IBM Plex Mono', monospace; }

      button { cursor: pointer; border: none; font-family: inherit; font-weight: 700; }
      .btn-reset { background: rgba(244, 63, 94, 0.1); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.2); padding: 8px 16px; border-radius: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; }
      .btn-reset:hover { background: rgba(244, 63, 94, 0.2); }

      /* Command Bar */
      .command-bar {
        position: fixed; bottom: 0; left: 0; right: 0;
        background: #0c0f16;
        border-top: 1px solid var(--border);
        padding: 12px 32px;
        display: flex; gap: 16px;
        align-items: center;
        z-index: 100;
        box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
      }
      .command-bar select {
        background: #1a1f2e;
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px 12px;
        border-radius: 4px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11px;
        outline: none;
        appearance: none;
        cursor: pointer;
      }
      .command-bar select option {
        background: #0c0f16;
        color: var(--text);
      }
      .command-bar input {
        flex: 1;
        background: transparent;
        border: 1px solid var(--border);
        color: #fff;
        padding: 8px 16px;
        border-radius: 4px;
        font-family: inherit;
        font-size: 13px;
        outline: none;
      }
      .command-bar input:focus { border-color: var(--accent); }
      .command-bar button {
        background: var(--accent);
        color: #000;
        padding: 8px 24px;
        border-radius: 4px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      #meshGraph {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="app" style="padding-bottom: 80px;">
      <header class="header">
        <canvas id="meshGraph"></canvas>
        <div class="brand">
          <h1 id="dashTitle">ROME Dashboard</h1>
          <p>Autonomous Mesh Intelligence · Sovereign Command</p>
        </div>

        <div class="sys-info">
          <div id="meshTopology" style="display: flex; gap: 8px;"></div>
          <div class="stat-chip">
            <label>Cost</label>
            <span class="val" id="statCost">$0.0000</span>
            <span class="sub-val">(PROJ: <span id="statProjectCost">$0.0000</span>)</span>
          </div>
          <div class="stat-chip">
            <label>Tokens</label>
            <span class="val" id="statTokens">0</span>
            <span class="sub-val">(PROJ: <span id="statProjectTokens">0</span>)</span>
          </div>
          <div class="stat-chip">
            <label>Throughput</label>
            <span class="val" id="statThroughput">0 tasks/min</span>
          </div>
        </div>
      </header>

      <div class="main">
        <div class="main-content">
          <div class="box">
            <div class="box-header" onclick="this.parentElement.classList.toggle('collapsed')">
              <h2>Active Causal Pipeline</h2>
              <div id="caps" style="display:flex; gap:8px;"></div>
            </div>
            <div class="scroll">
              <div class="task-grid" id="taskGrid"></div>
            </div>
          </div>
        </div>

        <div class="sidebar">
          <div class="box">
            <div class="box-header" onclick="this.parentElement.classList.toggle('collapsed')"><h2>Sovereign Blackboard</h2></div>
            <div class="scroll" id="stateBlackboard" style="padding:16px;">
              <div id="stateGrid" style="display:grid; gap:12px;"></div>
            </div>
          </div>

          <div class="box">
            <div class="box-header" onclick="this.parentElement.classList.toggle('collapsed')"><h2>Signal Stream</h2><span id="logCount" class="chip">0</span></div>
            <div class="scroll" id="logStream"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="modal" class="overlay" onclick="this.classList.remove('active')">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="box-header"><h2 id="modalTitle">REPORT</h2><button class="btn-reset" style="color:var(--text-dim)" onclick="document.getElementById('modal').classList.remove('active')">CLOSE</button></div>
        <div class="modal-body"><pre id="modalContent"></pre></div>
      </div>
    </div>

    <div class="command-bar">
      <select id="cmdCap"></select>
      <input type="text" id="cmdInput" placeholder="Command prompt..." onkeydown="if(event.key==='Enter') submitCommand()">
      <button onclick="submitCommand()">Dispatch</button>
    </div>

    <script>
      (function() {
        const state = { socket: null, tasks: new Map(), logs: [], history: [], workers: [], cost: 0, tokens: 0, projectCost: 0, projectTokens: 0, agents: [], blackboard: {} };
        const els = {
          grid: document.getElementById('taskGrid'),
          logs: document.getElementById('logStream'),
          mesh: document.getElementById('meshTopology'),
          cost: document.getElementById('statCost'),
          projectCost: document.getElementById('statProjectCost'),
          throughput: document.getElementById('statThroughput'),
          workers: document.getElementById('statWorkers'),
          tokens: document.getElementById('statTokens'),
          projectTokens: document.getElementById('statProjectTokens'),
          uptime: document.getElementById('uptime'),
          modal: document.getElementById('modal'),
          modalTitle: document.getElementById('modalTitle'),
          modalContent: document.getElementById('modalContent'),
          cmdCap: document.getElementById('cmdCap'),
          cmdInput: document.getElementById('cmdInput'),
          stateGrid: document.getElementById('stateGrid')
        };

        function renderBlackboard() {
          if (!els.stateGrid) return;
          const keys = Object.keys(state.blackboard).sort();
          if (keys.length === 0) {
            els.stateGrid.innerHTML = `<div style="color:var(--text-dim); font-size:11px; text-align:center; padding:20px;">State is currently empty</div>`;
            return;
          }
          els.stateGrid.innerHTML = keys.map(k => {
            const val = state.blackboard[k];
            let color = 'var(--accent)';
            if (val === 'SUCCESS' || val === 'CLEAN') color = 'var(--success)';
            if (val === 'FAILED' || val === 'DIRTY') color = 'var(--failed)';
            
            return `
              <div style="background:rgba(255,255,255,0.02); border:1px solid var(--border); border-radius:4px; padding:10px;">
                <div style="font-size:10px; font-weight:700; color:var(--text-dim); text-transform:uppercase; margin-bottom:4px;">${k}</div>
                <div style="font-family:'IBM Plex Mono', monospace; font-size:13px; color:${color}; font-weight:700;">${val}</div>
              </div>
            `;
          }).join("");
        }

        window.submitCommand = () => {
          const cap = els.cmdCap.value;
          const prompt = els.cmdInput.value.trim();
          if (!prompt) return;
          send("dispatch", { capability: cap, prompt: prompt, goal: prompt.slice(0,50), intent: "Manual Dashboard Dispatch" });
          els.cmdInput.value = "";
        };

        function renderMesh() {
          if (!els.mesh) return;
          // Deduplicate connected agents by capability
          const seen = new Map();
          for (const a of (state.agents || [])) {
            const key = (a.capabilities || []).join(',') || a.worker_id;
            seen.set(key, a);
          }
          const agents = Array.from(seen.values());
          const connectedCaps = new Set();
          agents.forEach(a => (a.capabilities || []).forEach(c => connectedCaps.add(c)));

          // Merge probe results — declared caps not currently connected but
          // known-available show as "idle"; unavailable show greyed with reason.
          const probe = state.capabilitiesProbe || {};
          const chips = [];
          for (const a of agents) {
            const caps = (a.capabilities || []).join(',');
            chips.push(`<div class="chip" title="${a.peer_url || 'local'}"><span style="color:var(--accent)">[${caps}]</span></div>`);
          }
          for (const [cap, info] of Object.entries(probe)) {
            if (connectedCaps.has(cap)) continue;
            const ok = info && info.available;
            const color = ok ? '#64748b' : '#dc2626';
            const label = ok ? `[${cap}]` : `[${cap} ✗]`;
            const tip = ok ? `${cap}: available but not connected` : `${cap}: ${info?.reason || 'unavailable'}`;
            chips.push(`<div class="chip" title="${tip}" style="opacity:0.55"><span style="color:${color}">${label}</span></div>`);
          }
          els.mesh.innerHTML = chips.join("");

          // Update command dropdown — only connected caps are dispatchable
          const allCaps = new Set(['NATIVE_SHELL']);
          agents.forEach(a => (a.capabilities || []).forEach(c => allCaps.add(c)));
          const current = els.cmdCap.value;
          els.cmdCap.innerHTML = Array.from(allCaps).sort().map(c => `<option value="${c}" ${c===current?'selected':''}>${c}</option>`).join("");
          
          renderBlackboard();
        }

        // --- MESH GRAPH ANIMATION (CURVES) ---
        const canvas = document.getElementById('meshGraph');
        const ctx = canvas.getContext('2d');
        const waves = [];
        function getCapColor(cap) {
          const c = String(cap || '').toUpperCase();
          if (c === 'GEMINI') return '#38bdf8'; // Blue
          if (c === 'MISTRAL') return '#f59e0b'; // Orange
          if (c === 'CLAUDE') return '#a855f7'; // Purple
          if (c === 'SAFE_SHELL') return '#22c55e'; // Green
          return '#64748b'; // Slate
        }

        function taskWaveColor(task) {
          if (!task) return '#475569';
          const s = String(task.status || '').toLowerCase();
          if (s === 'failed' || s === 'error' || s === 'cancelled') return '#f43f5e';
          if (s === 'success' || s === 'completed') return '#10b981';
          return getCapColor(task.capability);
        }

        function syncWavesToTasks() {
          const tasks = Array.from(state.tasks.values()).filter(t => t.status !== 'expired');
          const taskIds = new Set(tasks.map(t => t.task_id));
          const waveIds = new Set(waves.map(w => w.task_id));
          
          // Ensure at least 6 ambient waves for constant background activity
          if (waves.filter(w => !w.task_id).length < 6) {
            waves.push({ 
              task_id: null, 
              color: 'rgba(56, 189, 248, 0.2)', 
              base: 0.5, 
              speed: 0.0004 + Math.random() * 0.0008, 
              freq: 0.004 + Math.random() * 0.006, 
              offset: Math.random() * Math.PI * 2, 
              currentAmp: 0, 
              targetAmp: 25 + Math.random() * 5, 
              dying: false 
            });
          }

          tasks.forEach(t => {
            if (!waveIds.has(t.task_id)) {
              waves.push({ 
                task_id: t.task_id, 
                color: taskWaveColor(t), 
                base: 0.5, 
                speed: 0.001 + Math.random() * 0.0015, 
                freq: 0.007 + Math.random() * 0.010, 
                offset: Math.random() * Math.PI * 2, 
                currentAmp: 0, 
                targetAmp: 30, 
                dying: false 
              });
            }
          });
          waves.forEach(wv => {
            if (!wv.task_id) return;
            const t = state.tasks.get(wv.task_id);
            if (!t || !taskIds.has(wv.task_id)) { wv.dying = true; wv.targetAmp = 0; return; }
            wv.color = taskWaveColor(t);
            const s = String(t.status || '').toLowerCase();
            if (s === 'running') wv.targetAmp = 28 + (t.progress_percent || 0) * 0.03; // Max 31
            else if (s === 'completed' || s === 'success' || s === 'failed' || s === 'error') wv.targetAmp = 15;
            else { wv.targetAmp = 0; wv.dying = true; }
          });
        }
        function drawGraph() {
          if (!canvas) return;
          syncWavesToTasks();
          const w = canvas.width = canvas.offsetWidth;
          const h = canvas.height = canvas.offsetHeight;
          if (w === 0 || h === 0) { requestAnimationFrame(drawGraph); return; }
          ctx.clearRect(0, 0, w, h);
          const time = Date.now();
          for (let i = waves.length - 1; i >= 0; i--) {
            const wv = waves[i];
            wv.currentAmp += (wv.targetAmp - wv.currentAmp) * 0.05;
            if (wv.dying && wv.currentAmp < 0.5) { waves.splice(i, 1); continue; }
            
            ctx.beginPath();
            ctx.strokeStyle = wv.color;
            ctx.lineWidth = wv.task_id ? 1.5 : 1;
            ctx.globalAlpha = Math.min(0.5, wv.currentAmp / 35 * 0.5);
            for (let x = 0; x <= w; x += 2) {
              const mainSin = Math.sin(x * wv.freq + time * wv.speed + wv.offset);
              const harmonicSin = Math.sin(x * wv.freq * 2.2 + time * wv.speed * 1.3) * 0.2;
              // Total multiplier is 1.2 max. With targetAmp 31, max deviation is 37.2px.
              // Center is 40px. 40 +/- 37.2 fits perfectly within 0-80px.
              const y = h * wv.base + (mainSin + harmonicSin) * wv.currentAmp;
              x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            }
            ctx.stroke();
          }
          ctx.globalAlpha = 1.0;
          requestAnimationFrame(drawGraph);
        }
        drawGraph();

        function formatTime(s) {
          if (!s) return "00s";
          if (s < 60) return s.toFixed(0).padStart(2, '0') + "s";
          const m = Math.floor(s / 60);
          const h = Math.floor(m / 60);
          if (h > 0) return `${String(h).padStart(2, '0')}h ${String(m%60).padStart(2, '0')}m`;
          return `${String(m).padStart(2, '0')}m ${String(Math.floor(s%60)).padStart(2, '0')}s`;
        }

        function getColor(status) {
          const s = String(status || "").toLowerCase();
          if (s === "success" || s === "completed") return "var(--success)";
          if (s === "failed" || s === "error" || s === "cancelled") return "var(--failed)";
          if (s === "pending") return "var(--pending)";
          if (s === "running") return "var(--running)";
          return "var(--registered)";
        }

        function addLog(type, tid, msg, ts) {
          const logTs = ts ? (ts * (ts > 1e12 ? 1 : 1000)) : Date.now();
          state.logs.unshift({ ts: logTs, type, tid, msg });
          state.logs = state.logs.slice(0, 50);
          if (document.getElementById('logCount')) document.getElementById('logCount').textContent = state.logs.length;
          els.logs.innerHTML = state.logs.map(l => `
            <div class="log-line">
              <span class="ts">${new Date(l.ts).toLocaleTimeString([], {hour12:false, hour:'2-digit', minute:'2-digit', second:'2-digit'})}</span>
              <span class="tag">${l.type}</span>
              <span class="msg">${tid !== '-' ? `[${tid}] ` : ''}${msg}</span>
            </div>
          `).join("");
        }

        function renderStats() {
          els.cost.textContent = "$" + (state.cost || 0).toFixed(4);
          if (els.projectCost) els.projectCost.textContent = "$" + (state.projectCost || 0).toFixed(4);
          els.tokens.textContent = (state.tokens || 0).toLocaleString();
          if (els.projectTokens) els.projectTokens.textContent = (state.projectTokens || 0).toLocaleString();
          els.workers.textContent = state.workers.length + " active";
          const now = Date.now();
          state.history = state.history.filter(t => now - t < 60000);
          els.throughput.textContent = state.history.length + " tasks/min";
          syncWavesToTasks();
        }

        function renderTasks() {
          const tasks = Array.from(state.tasks.values())
            .filter(t => t.status !== 'expired')
            .sort((a,b) => b.updated_at - a.updated_at);
          
          if (!tasks.length) {
            els.grid.innerHTML = `<div style="padding:40px; text-align:center; color:var(--text-dim); font-size:12px; letter-spacing:0.1em; border:1px dashed var(--border); grid-column:1/-1;">NO MESH ACTIVITY DETECTED</div>`;
            return;
          }

          els.grid.innerHTML = tasks.map(t => {
            const statusColor = getColor(t.status);
            const capColor = getCapColor(t.capability);
            const pct = Math.min(100, Math.max(0, t.progress_percent || 0));
            const elapsed = formatTime((t.completed_at || (Date.now()/1000)) - t.created_at);
            
            // Status overrides capability color for the border/badge
            const s = String(t.status || "").toLowerCase();
            let displayColor = capColor;
            if (s === "success" || s === "completed") displayColor = "var(--success)";
            else if (s === "failed" || s === "error" || s === "cancelled") displayColor = "var(--failed)";
            else if (s === "pending") displayColor = "var(--pending)";

            // SURFACE CAUSAL CHAIN
            const goal = t.goal || t.task_id;
            const intent = t.intent || "Implicit task goal";
            const cause = (t.status === "failed" || t.status === "error") ? (t.cause || t.progress_message || "Execution error") : null;

            return `
              <div class="card" style="--status-color: ${displayColor}" onclick="viewReport('${t.task_id}')">
                <div class="card-head">
                  <span class="task-id">${t.task_id}</span>
                  <span class="cap-badge" style="color:var(--status-color); border-color:${displayColor}44">${t.capability}</span>
                </div>
                <div class="goal">${goal}</div>
                <div class="intent">${intent}</div>
                <div class="prog-bar"><div class="prog-fill" style="width:${pct}%; background:${statusColor}"></div></div>
                <div class="card-foot">
                  <span>${pct.toFixed(0)}%</span>
                  <span style="color:${statusColor}">${t.status.toUpperCase()}</span>
                  <span>${elapsed}</span>
                </div>
                ${cause ? `<div class="cause">CAUSE: ${cause}</div>` : ''}
              </div>
            `;
          }).join("");
        }

        window.viewReport = (tid) => {
          const task = state.tasks.get(tid);
          els.modalTitle.textContent = "TASK REPORT :: " + tid;
          els.modalContent.textContent = task.report || "Requesting report from mesh...";
          els.modal.classList.add('active');
        };

        function send(cmd, p) {
          if (!state.socket || state.socket.readyState !== 1) return;
          state.socket.send(JSON.stringify({ type:"command", command:cmd, request_id:"r"+Date.now(), payload:p||{} }));
        }

        function connect() {
          const ws = new WebSocket(((window.location.protocol==="https:")?"wss:":"ws:")+"//"+window.location.host+"/ws");
          state.socket = ws;
          
          ws.onmessage = (m) => {
            const data = JSON.parse(m.data);
            if (data.type === "response" && data.ok) {
              const p = data.payload;
              if (p.tasks) { Object.keys(p.tasks).forEach(id => state.tasks.set(id, p.tasks[id])); renderTasks(); }
              if (p.workers) { state.workers = p.workers; renderStats(); }
              if (p.state) { state.blackboard = p.state; renderBlackboard(); }
              if (p.session_cost_usd !== undefined) state.cost = p.session_cost_usd;
              if (p.session_worker_tokens !== undefined) state.tokens = p.session_worker_tokens + (p.session_dictator_tokens || 0);
              if (p.project_total_cost_usd !== undefined) state.projectCost = p.project_total_cost_usd;
              if (p.project_total_tokens !== undefined) state.projectTokens = p.project_total_tokens;
              if (p.content) els.modalContent.textContent = p.content;
              if (p.dictator) document.getElementById('dashTitle').textContent = "ROME :: " + p.dictator.toUpperCase();
              renderStats();
            }
            if (data.type === "event") {
              const ev = data.event; const tid = ev.task_id; const p = ev.payload;
              if (ev.type === "progress" && state.tasks.has(tid)) {
                const t = state.tasks.get(tid); t.progress_percent = p.percent; t.progress_message = p.message; t.updated_at = ev.ts; renderTasks(); syncWavesToTasks();
              } else if (ev.type === "state_changed") {
                state.blackboard[p.key] = p.value;
                renderBlackboard();
                addLog("STATE", tid, `${p.key} → ${p.value}`, ev.ts);
              } else if (ev.type === "complete") {
                if (!state.tasks.has(tid)) state.tasks.set(tid, { task_id: tid, status: 'running' });
                if (state.tasks.has(tid)) {
                  const rawStatus = String(p.status || '').toUpperCase();
                  const normStatus = ['SUCCESS','OK','COMPLETED'].includes(rawStatus) ? 'completed' : (rawStatus === 'FAILED' ? 'failed' : (rawStatus === 'CANCELLED' ? 'cancelled' : p.status));
                  const t = state.tasks.get(tid); t.status = normStatus; t.completed_at = ev.ts; t.report = p.report;
                  if (p.usage) {
                    state.cost += (p.usage.cost_usd || 0);
                    state.tokens += (p.usage.total_tokens || 0);
                    state.projectCost += (p.usage.cost_usd || 0);
                    state.projectTokens += (p.usage.total_tokens || 0);
                  }
                  state.history.push(Date.now()); renderTasks();
                }
                addLog("COMPLETE", tid, p.status, ev.ts);
                syncWavesToTasks();
              } else if (ev.type === "dispatch_start") {
                state.tasks.set(tid, { task_id:tid, capability:p.capability, status:"running", created_at:ev.ts, updated_at:ev.ts });
                renderTasks(); addLog("DISPATCH", tid, p.capability, ev.ts);
                syncWavesToTasks();
              } else if (ev.type === "system_status") {
                state.agents = p.agents || [];
                state.capabilitiesProbe = p.capabilities_probe || {};
                renderMesh();
              }
              renderStats();
            }
          };

          ws.onopen = () => { 
            send("get_state",{}); 
          };
          ws.onclose = () => { 
            setTimeout(connect, 3000); 
          };
        }
        connect();
        setInterval(() => send("status", {summary:true}), 5000);
      })();
    </script>
  </body>
</html>
